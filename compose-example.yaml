services:
  ai-usage:
    image: ghcr.io/tbshfr/ai-usage:latest
    container_name: ai-usage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    environment:
      AI_USAGE_HTTP_ADDR: ":8080"
      AI_USAGE_OTLP_HTTP_ADDR: ":4318"
      AI_USAGE_DASHBOARD_USER: ${AI_USAGE_DASHBOARD_USER:?set in .env}
      AI_USAGE_DASHBOARD_PASSWORD: ${AI_USAGE_DASHBOARD_PASSWORD:?set in .env}
      AI_USAGE_OTLP_TOKEN: ${AI_USAGE_OTLP_TOKEN:?set in .env}
      AI_USAGE_LOG_LEVEL: info

      # Optional R2 backups: uncomment this entire block after filling .env.
      # Temporary snapshots use /data; allow space for SQLite + gzip + WAL.
      # AI_USAGE_BACKUP_S3_BUCKET: ${AI_USAGE_BACKUP_S3_BUCKET:?set in .env}
      # AI_USAGE_BACKUP_S3_REGION: ${AI_USAGE_BACKUP_S3_REGION:?set auto in .env}
      # AI_USAGE_BACKUP_S3_PREFIX: ${AI_USAGE_BACKUP_S3_PREFIX:?set in .env}
      # AI_USAGE_BACKUP_S3_ENDPOINT: ${AI_USAGE_BACKUP_S3_ENDPOINT:?set in .env}
      # AI_USAGE_BACKUP_S3_ACCESS_KEY_ID: ${AI_USAGE_BACKUP_S3_ACCESS_KEY_ID:?set in .env}
      # AI_USAGE_BACKUP_S3_SECRET_ACCESS_KEY: ${AI_USAGE_BACKUP_S3_SECRET_ACCESS_KEY:?set in .env}

    expose:
      - 8080
      - 4318
      # Enable port 4317 together with AI_USAGE_OTLP_GRPC_ADDR.
      # - 4317

    volumes:
      - ./data:/data

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    networks:
      - proxy

networks:
  proxy:
    external: true
