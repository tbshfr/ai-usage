{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · AI Usage</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.login-wrap { max-width: 22rem; margin: 6rem auto 0; }
.login-card { background: var(--bg, #fff); border: 1px solid var(--border, #ddd); border-radius: 8px; padding: 2rem; }
.login-card h1 { font-size: 1.25rem; margin: 0 0 1rem; }
.login-card label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
.login-card input { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid var(--border, #ccc); border-radius: 4px; }
.login-card button { margin-top: 1.25rem; width: 100%; padding: 0.5rem; }
.login-error { color: #b00020; margin: 0 0 0.5rem; }
</style>
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <h1>AI Usage</h1>
    {{with .Error}}<p class="login-error">{{.}}</p>{{end}}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>{{end}}
