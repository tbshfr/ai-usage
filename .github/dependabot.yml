version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * 1" # Mondays at 04:00
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * 1" # Mondays at 04:00
    cooldown:
      default-days: 7
    groups:
      aws-sdk-go-v2:
        patterns:
          - github.com/aws/aws-sdk-go-v2
          - github.com/aws/aws-sdk-go-v2/*
      telemetry:
        patterns:
          - go.opentelemetry.io/*
          - google.golang.org/grpc
          - google.golang.org/protobuf
