{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · AI Usage</title>
<link rel="stylesheet" href="/static/vendor/uplot.min.css">
<link rel="stylesheet" href="/static/app.css">
<!-- htmx's injected indicator <style> would violate the CSP (style-src
     'self'); the rules live in app.css instead. -->
<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
<!-- Loaded blocking (no defer) in the head: chart JSON blocks rendered in
     the body need renderDataCharts() registered before first paint. -->
<script src="/static/vendor/htmx.min.js"></script>
<script src="/static/vendor/sse.min.js"></script>
<script src="/static/vendor/uplot.min.js"></script>
<script src="/static/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">AI Usage</a>
  <nav>
    <a href="/"{{if eq .Active "dashboard"}} class="active"{{end}}>Dashboard</a>
    <a href="/trends"{{if eq .Active "trends"}} class="active"{{end}}>Trends</a>
    <a href="/breakdowns"{{if eq .Active "breakdowns"}} class="active"{{end}}>Breakdowns</a>
    <a href="/sessions"{{if eq .Active "sessions"}} class="active"{{end}}>Sessions</a>
    {{if .ShowLogout}}<a href="/logout" class="logout-link">Sign out</a>{{end}}
  </nav>
</header>
<!-- The SSE connection stays open for the page's lifetime; its
     data-changed events re-trigger whichever fragments this page renders
     (other pages' fragments are not in the DOM, so they never refetch). -->
<main hx-ext="sse" sse-connect="/events">{{template "content" .}}</main>
<footer class="muted">All timestamps are UTC. · {{.Version}}</footer>
</body>
</html>{{end}}
