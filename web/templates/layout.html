{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf5ee">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>{{.Title}} · AI Usage</title>
<link rel="stylesheet" href="{{staticURL "vendor/uplot.min.css"}}">
<link rel="stylesheet" href="{{staticURL "app.css"}}">
<!-- htmx 4 injects indicator styles through a CSSStyleSheet, which the
     CSP (style-src 'self') blocks too; the rules live in app.css instead. -->
<meta name="htmx-config" content='{"includeIndicatorCSS":false}'>
<!-- Loaded blocking (no defer) in the head: chart JSON blocks rendered in
     the body need renderDataCharts() registered before first paint. -->
<script src="{{staticURL "vendor/htmx.min.js"}}"></script>
<script src="{{staticURL "vendor/hx-sse.min.js"}}"></script>
<script src="{{staticURL "vendor/uplot.min.js"}}"></script>
<script src="{{staticURL "app.js"}}"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">AI Usage</a>
  <nav id="site-nav">
    <button class="nav-close" type="button" aria-controls="site-nav" aria-label="Close menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
    <a href="/"{{if eq .Active "dashboard"}} class="active"{{end}}>Dashboard</a>
    <a href="/trends?range=7d"{{if eq .Active "trends"}} class="active"{{end}}>Trends</a>
    <a href="/breakdowns"{{if eq .Active "breakdowns"}} class="active"{{end}}>Breakdowns</a>
    <a href="/sessions"{{if eq .Active "sessions"}} class="active"{{end}}>Sessions</a>
    <a href="/stats"{{if eq .Active "stats"}} class="active"{{end}}>Stats</a>
    <a href="/setup"{{if eq .Active "setup"}} class="active"{{end}}>Setup</a>
    {{if .ShowLogout}}<a href="/logout" class="logout-link drawer-only">Sign out</a>{{end}}
  </nav>
  {{if .ShowLogout}}<a href="/logout" class="logout-link">Sign out</a>{{end}}
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>
</header>
<div class="nav-overlay"></div>
<!-- One SSE stream signals visible fragments to refresh. pauseOnBackground
     closes it while the page is hidden, avoiding one idle connection per tab. -->
<main hx-sse:connect="/events">{{template "content" .}}</main>
<footer class="muted">All timestamps are UTC. · {{.Version}}</footer>
</body>
</html>{{end}}
