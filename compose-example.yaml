services:
  ai-usage:
    image: ghcr.io/tbshfr/ai-usage:latest
    container_name: ai-usage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    environment:
      AI_USAGE_HTTP_ADDR: ":8080"
      AI_USAGE_OTLP_HTTP_ADDR: ":4318"
      AI_USAGE_DASHBOARD_USER: ${AI_USAGE_DASHBOARD_USER:?set in .env}
      AI_USAGE_DASHBOARD_PASSWORD: ${AI_USAGE_DASHBOARD_PASSWORD:?set in .env}
      # Optional: persistent dashboard logins across restarts, and their
      # lifetime (default 7d). Empty keeps the per-restart random secret.
      AI_USAGE_SESSION_SECRET: ${AI_USAGE_SESSION_SECRET:-}
      AI_USAGE_SESSION_TTL: ${AI_USAGE_SESSION_TTL:-}
      # Optional: imported once as the "default" OTLP token. Manage tokens
      # on the dashboard's OTLP tokens page.
      AI_USAGE_OTLP_TOKEN: ${AI_USAGE_OTLP_TOKEN:-}
      AI_USAGE_LOG_LEVEL: info

      # Optional S3/R2 backups: uncomment this entire block after filling .env.
      # Temporary snapshots use /data; allow space for SQLite + gzip + WAL.
      # The endpoint stays empty for Amazon S3; the session token is optional.
      # AI_USAGE_BACKUP_S3_BUCKET: ${AI_USAGE_BACKUP_S3_BUCKET:?set in .env}
      # AI_USAGE_BACKUP_S3_REGION: ${AI_USAGE_BACKUP_S3_REGION:?set in .env (auto for R2)}
      # AI_USAGE_BACKUP_S3_PREFIX: ${AI_USAGE_BACKUP_S3_PREFIX:?set in .env}
      # AI_USAGE_BACKUP_S3_ENDPOINT: ${AI_USAGE_BACKUP_S3_ENDPOINT:-}
      # AI_USAGE_BACKUP_S3_ACCESS_KEY_ID: ${AI_USAGE_BACKUP_S3_ACCESS_KEY_ID:?set in .env}
      # AI_USAGE_BACKUP_S3_SECRET_ACCESS_KEY: ${AI_USAGE_BACKUP_S3_SECRET_ACCESS_KEY:?set in .env}
      # AI_USAGE_BACKUP_S3_SESSION_TOKEN: ${AI_USAGE_BACKUP_S3_SESSION_TOKEN:-}

    expose:
      - 8080
      - 4318
      # Enable port 4317 together with AI_USAGE_OTLP_GRPC_ADDR.
      # - 4317

    volumes:
      - ./data:/data

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    networks:
      - proxy

networks:
  proxy:
    external: true
